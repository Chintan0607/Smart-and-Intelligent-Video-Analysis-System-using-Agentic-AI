# finetune_realesrgan_gan.yml
# STAGE 2: adversarial (GAN) fine-tuning, starting from the PSNR-only
# generator you already trained (net_g_latest.pth). Adds a discriminator
# so the generator is pushed toward sharper, more realistic textures,
# not just minimizing pixel/feature distance.
#
# Run with (from inside RealESRGAN-train/):
#   python realesrgan/train.py -opt ../options/finetune_realesrgan_gan.yml

name: finetune_RealESRGAN_gan
model_type: SRGANModel        # basicsr's GENERIC GAN model -- works with plain
                               # paired data (unlike RealESRGANModel, which is
                               # hard-wired to RealESRGANDataset's synthetic
                               # degradation and would crash the same way
                               # RealESRNetModel did earlier)
scale: 4
num_gpu: 1
manual_seed: 0

datasets:
  train:
    name: CCTV_SR4x_GAN
    type: RealESRGANPairedDataset
    dataroot_gt: ''
    dataroot_lq: ''
    meta_info: ../meta_info_sr4x_blur.txt   # same real paired data as stage 1
    io_backend:
      type: disk

    gt_size: 224
    use_hflip: true
    use_rot: true

    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

network_g:
  type: RRDBNet
  num_in_ch: 3
  num_out_ch: 3
  num_feat: 64
  num_block: 23
  num_grow_ch: 32

network_d:
  type: UNetDiscriminatorSN   # the discriminator architecture RealESRGAN
  num_in_ch: 3                # itself uses -- already available since it's
  num_feat: 64                # part of the realesrgan package you installed
  skip_connection: true

path:
  pretrain_network_g: ../RealESRGAN-train/experiments/finetune_RealESRGANx4plus_sr/models/net_g_latest.pth
  param_key_g: params
  strict_load_g: true
  pretrain_network_d: ~       # discriminator starts from scratch (standard practice)
  resume_state: ~

train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  optim_d:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [10000, 20000]
    gamma: 0.5

  total_iter: 60000
  warmup_iter: -1

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      'conv5_4': 1
    vgg_type: vgg19
    use_input_norm: true
    perceptual_weight: 1.0
    style_weight: 0
    range_norm: false
    criterion: l1

  gan_opt:
    type: GANLoss
    gan_type: vanilla
    real_label_val: 1.0
    fake_label_val: 0.0
    loss_weight: !!float 1e-1   # small weight -- GAN loss guides texture/realism,
                                  # pixel+perceptual loss still dominates overall

  net_d_iters: 1
  net_d_init_iters: 0

val:
  val_freq: !!float 5e3
  save_img: true

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true

dist_params:
  backend: nccl
  port: 29500
