# finetune_nafnet_blur.yml
# Fine-tune NAFNet on real paired blur data, starting from the official
# GoPro pretrained checkpoint.
#
# IMPORTANT: run this using NAFNet's OWN bundled basicsr, not the pip
# package -- from inside the cloned NAFNet-train repo:
#   python basicsr/train.py -opt ../options/finetune_nafnet_blur.yml
#
# If the dataset param name below ('meta_info_file') doesn't match what
# NAFNet-train/basicsr/data/paired_image_dataset.py actually expects,
# check that file for the exact key name and let me know -- easy one-line fix.

name: finetune_NAFNet_blur
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 0

datasets:
  train:
    name: CCTV_Blur
    type: PairedImageDataset
    dataroot_gt: ~
    dataroot_lq: ~
    meta_info_file: ../meta_info_blur.txt
    io_backend:
      type: disk

    gt_size: 256
    use_hflip: true
    use_rot: true

    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

network_g:
  type: NAFNet
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]

path:
  pretrain_network_g: ../weights_nafnet/NAFNet-GoPro-width64.pth
  strict_load_g: true
  resume_state: ~

train:
  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.9]

  scheduler:
    type: MultiStepLR
    milestones: [20000, 35000, 50000]
    gamma: 0.5

  total_iter: 60000
  warmup_iter: -1

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: !!float 5e3
  save_img: true

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true

dist_params:
  backend: nccl
  port: 29500
