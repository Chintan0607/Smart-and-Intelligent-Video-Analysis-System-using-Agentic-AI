# finetune_nafnet_noise.yml
# Fine-tune NAFNet on real paired gaussian_noise data, starting from the
# official SIDD pretrained checkpoint.
#
# Run using NAFNet's own bundled basicsr, from inside NAFNet-train/:
#   python basicsr/train.py -opt ../options/finetune_nafnet_noise.yml

name: finetune_NAFNet_noise
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 0

datasets:
  train:
    name: CCTV_Noise
    type: PairedImageDataset
    dataroot_gt: ~
    dataroot_lq: ~
    meta_info_file: ../meta_info_gaussian_noise.txt
    io_backend:
      type: disk

    gt_size: 256
    use_hflip: true
    use_rot: true

    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

network_g:
  type: NAFNet
  width: 64
  enc_blk_nums: [2, 2, 4, 8]
  middle_blk_num: 12
  dec_blk_nums: [2, 2, 2, 2]

path:
  pretrain_network_g: ../weights_nafnet/NAFNet-SIDD-width64.pth
  strict_load_g: true
  resume_state: ~

train:
  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.9]

  scheduler:
    type: MultiStepLR
    milestones: [20000, 35000, 50000]
    gamma: 0.5

  total_iter: 60000
  warmup_iter: -1

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: !!float 5e3
  save_img: true

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true

dist_params:
  backend: nccl
  port: 29500
