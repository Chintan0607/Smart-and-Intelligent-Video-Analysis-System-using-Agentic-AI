# finetune_paired.yml
# Fine-tune Real-ESRGAN (x4plus generator) on REAL paired data --
# your actual blur/gaussian_noise/low_light images matched against
# clean_data/ground_truth_output, instead of synthetic on-the-fly
# degradation. This is more faithful to your real-world use case.
#
# Run with:
#   python realesrgan/train.py -opt options/finetune_paired.yml

name: finetune_RealESRGANx4plus_paired
model_type: RealESRGANModel
scale: 4
num_gpu: 1
manual_seed: 0

# ----------------- dataset ----------------- #
datasets:
  train:
    name: CCTV_PairedData
    type: RealESRGANPairedDataset
    dataroot_gt: ~     # left empty -- meta_info file below contains full absolute paths
    dataroot_lq: ~
    meta_info: ../meta_info_paired.txt   # generated by build_paired_meta.py
    io_backend:
      type: disk

    gt_size: 256          # training crop size -- lower (e.g. 128) if you hit OOM
    use_hflip: true
    use_rot: true

    # dataloader
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 8   # lower (e.g. 2-4) if you hit OOM
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

# ----------------- network ----------------- #
network_g:
  type: RRDBNet
  num_in_ch: 3
  num_out_ch: 3
  num_feat: 64
  num_block: 23
  num_grow_ch: 32

# ----------------- pretrained weights ----------------- #
path:
  pretrain_network_g: ../weights/RealESRGAN_x4plus.pth
  param_key_g: params_ema
  strict_load_g: true
  resume_state: ~

# ----------------- training settings ----------------- #
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [5000, 10000, 15000]
    gamma: 0.5

  total_iter: 20000       # adjust based on dataset size / time budget
  warmup_iter: -1

  # PSNR-oriented losses only (no GAN/discriminator -- lighter, more stable
  # starting point; ask for the full adversarial version once this works)
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      'conv5_4': 1
    vgg_type: vgg19
    use_input_norm: true
    perceptual_weight: 1.0
    style_weight: 0
    range_norm: false
    criterion: l1

# ----------------- validation / logging ----------------- #
val:
  val_freq: !!float 5e3
  save_img: true

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true

dist_params:
  backend: nccl
  port: 29500
